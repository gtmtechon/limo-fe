                explanation: "Azure Monitor에서 경고가 트리거될 때 수행할 작업을 정의하는 것이 행동 그룹(Action Group)입니다. 행동 그룹에는 이메일 보내기, SMS 메시지 보내기, 웹훅 호출, Azure 함수 실행 등 다양한 작업을 포함할 수 있습니다. 여러 수신자에게 이메일을 보내려면 행동 그룹을 만들어 구성해야 합니다."
            },
            {
                topic: "모니터링 및 백업",
                question: "100개의 가상 머신이 포함된 Azure 구독이 있습니다. 정기적으로 가상 머신을 만들고 삭제합니다. 삭제할 수 있는 연결되지 않은 디스크를 식별해야 합니다. 어떻게 해야 합니까?",
                options: ["A. Azure Cost Management에서 비용 분석 보기", "B. Azure Advisor에서 Advisor 구성 수정", "C. Microsoft Azure Storage Explorer에서 계정 관리 속성 확인", "D. Azure Cost Management에서 Advisor 권장 사항 보기"],
                answer: "D",
                explanation: "Azure Advisor는 Azure 리소스 사용을 최적화하기 위한 권장 사항을 제공하는 서비스입니다. 비용 최적화 범주에서 Advisor는 가상 머신에 연결되지 않은 관리 디스크와 같은 미사용 리소스를 식별하고 삭제를 권장하여 비용을 절감할 수 있도록 도와줍니다. 이러한 권장 사항은 Azure Cost Management에서도 확인할 수 있습니다."
            }
        ];

        let currentQuestionIndex = 0;
        let filteredQuestions = [...quizData];
        let score = 0;
        let answerChecked = false;
        
        const questionNumberEl = document.getElementById('question-number');
        const totalQuestionsEl = document.getElementById('total-questions');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainerEl = document.getElementById('options-container');
        const checkAnswerBtn = document.getElementById('check-answer-btn');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const feedbackContainerEl = document.getElementById('feedback-container');
        const feedbackResultEl = document.getElementById('feedback-result');
        const explanationTextEl = document.getElementById('explanation-text');
        const topicFiltersEl = document.getElementById('topic-filters');
        const progressEl = document.getElementById('progress');

        function loadQuestion(index) {
            answerChecked = false;
            const currentQuestion = filteredQuestions[index];
            questionNumberEl.textContent = index + 1;
            totalQuestionsEl.textContent = filteredQuestions.length;
            questionTextEl.textContent = currentQuestion.question;

            optionsContainerEl.innerHTML = '';
            currentQuestion.options.forEach(option => {
                const optionChar = option.substring(0, 1);
                const optionText = option.substring(3);
                
                const optionDiv = document.createElement('div');
                optionDiv.classList.add('quiz-option', 'p-4', 'border-2', 'border-gray-300', 'rounded-lg', 'cursor-pointer', 'hover:bg-blue-50', 'transition-all', 'duration-200');
                optionDiv.dataset.option = optionChar;
                
                const radioInput = document.createElement('input');
                radioInput.type = 'radio';
                radioInput.name = 'option';
                radioInput.value = optionChar;
                radioInput.id = `option${optionChar}`;
                radioInput.classList.add('hidden');

                const label = document.createElement('label');
                label.htmlFor = `option${optionChar}`;
                label.classList.add('flex', 'items-center', 'cursor-pointer', 'w-full');
                label.innerHTML = `<span class="font-bold mr-3">${optionChar}.</span> <span>${optionText}</span>`;
                
                optionDiv.appendChild(radioInput);
                optionDiv.appendChild(label);
                
                optionDiv.addEventListener('click', () => {
                    document.querySelectorAll('.quiz-option').forEach(el => el.classList.remove('selected'));
                    optionDiv.classList.add('selected');
                    radioInput.checked = true;
                });
                
                optionsContainerEl.appendChild(optionDiv);
            });

            feedbackContainerEl.classList.add('hidden');
            checkAnswerBtn.disabled = false;
            updateNavigationButtons();
            updateProgressBar();
        }

        function updateNavigationButtons() {
            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.disabled = currentQuestionIndex === filteredQuestions.length - 1;
        }
        
        function updateProgressBar() {
            const progressPercentage = ((currentQuestionIndex + 1) / filteredQuestions.length) * 100;
            progressEl.style.width = `${progressPercentage}%`;
        }

        function checkAnswer() {
            if (answerChecked) return;

            const selectedOption = document.querySelector('input[name="option"]:checked');
            if (!selectedOption) {
                alert('답을 선택해주세요.');
                return;
            }
            
            answerChecked = true;
            checkAnswerBtn.disabled = true;

            const userAnswer = selectedOption.value;
            const correctAnswer = filteredQuestions[currentQuestionIndex].answer;
            const selectedDiv = selectedOption.parentElement;
            
            if (userAnswer === correctAnswer) {
                feedbackResultEl.textContent = '정답입니다!';
                feedbackResultEl.className = 'text-xl font-bold mb-2 text-green-600';
                selectedDiv.classList.add('correct');
            } else {
                feedbackResultEl.textContent = '오답입니다.';
                feedbackResultEl.className = 'text-xl font-bold mb-2 text-red-600';
                selectedDiv.classList.add('incorrect');
                const correctDiv = document.querySelector(`div[data-option="${correctAnswer}"]`);
                if(correctDiv) correctDiv.classList.add('correct');
            }

            explanationTextEl.textContent = filteredQuestions[currentQuestionIndex].explanation;
            feedbackContainerEl.classList.remove('hidden');
        }

        checkAnswerBtn.addEventListener('click', checkAnswer);

        nextBtn.addEventListener('click', () => {
            if (currentQuestionIndex < filteredQuestions.length - 1) {
                currentQuestionIndex++;
                loadQuestion(currentQuestionIndex);
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion(currentQuestionIndex);
            }
        });
        
        topicFiltersEl.addEventListener('click', (e) => {
            if (e.target.classList.contains('topic-btn')) {
                const selectedTopic = e.target.dataset.topic;

                document.querySelectorAll('.topic-btn').forEach(btn => {
                    btn.classList.remove('active', 'bg-blue-500', 'text-white');
                    btn.classList.add('bg-white', 'text-gray-700');
                });
                e.target.classList.add('active', 'bg-blue-500', 'text-white');
                e.target.classList.remove('bg-white', 'text-gray-700');
                
                if (selectedTopic === 'all') {
                    filteredQuestions = [...quizData.slice(0, 100)];
                } else {
                    filteredQuestions = quizData.filter(q => q.topic === selectedTopic).slice(0, 100);
                }
                currentQuestionIndex = 0;
                loadQuestion(currentQuestionIndex);
            }
        });

        // 초기 질문 로드
        loadQuestion(currentQuestionIndex);
    </script>
</body>
</html>
